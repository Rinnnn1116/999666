			<div class="detail">
				餐桌上那盘红烧牛肉刚端上来，香气扑鼻，可有人拿着筷子却迟迟不敢下口。
				听说牛肉被列为了致癌物，心里顿时犯了嘀咕：这肉还能不能安心吃？
				难道以后真要明显告别这道美味？其实，关于牛肉致癌的说法在圈子里传了很久，
				让不少爱吃肉的朋友产生了误解。面对这样的传闻，没必要自己吓自己，更不必因噎废食。
				搞清楚其中的科学道理，
				掌握正确的吃法，照样能享受美食带来的快乐，同时守住健康的底线。

			</div>
